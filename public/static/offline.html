<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#061a36">
    <meta name="color-scheme" content="light dark">
    <script src="/static/theme.js"></script>
    <title>Offline | MicsBook</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 28px;
            background: #061a36;
            color: #fff8e8;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
        }
        main { max-width: 440px; }
        img { width: 132px; height: 132px; border-radius: 28px; }
        h1 { margin: 24px 0 8px; font-size: 2rem; }
        p { margin: 0 0 24px; color: #d6dfeb; line-height: 1.55; }
        a {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 999px;
            background: #f2b84b;
            color: #061a36;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
    <link rel="stylesheet" href="/static/theme.css">
</head>
<body class="offline-fallback">
    <main>
        <img src="/static/icons/icon-192.png" alt="">
        <h1>You are offline</h1>
        <p>The ebook library needs a connection to browse the catalog or open a book. Reconnect and try again.</p>
        <a href="/books">Try again</a>
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark theme"><svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13.2A9 9 0 0 1 10.8 3a9 9 0 1 0 10 10.2Z"/></svg><svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span data-theme-label>Dark mode</span></button>
    </main>
</body>
</html>
